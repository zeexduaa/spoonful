name: Publish to GitHub Pages

# Builds the site and publishes it at https://<owner>.github.io/spoonful/ on every push to main.
#
# Publishing needs GitHub Pages switched on once, by the repository's owner:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then this workflow still builds and tests the site, then stops with a notice instead of
# failing (and sending a failure email) on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::The site was built and tested but not published. To publish it, open Settings > Pages and set Source to 'GitHub Actions'; the next push (or a re-run of this workflow) publishes it."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
